[project]
name = "secondlook"
version = "0.1.0"
description = "Login multibiometrico step-up (volto e keystroke) guidato dall'SRR"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9,<5",   # OpenCV 5 ha tolto Viola-Jones (CascadeClassifier)
    "insightface>=0.7.3",
    "onnxruntime>=1.17",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secondlook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:`estimate` is deprecated:FutureWarning:insightface.*",
]

[tool.uv]
constraint-dependencies = ["scikit-image<2.2"]